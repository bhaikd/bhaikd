<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 360" width="490" height="360">
  <style>
    .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1px; rx: 10px; ry: 10px; }
    .dot-red { fill: #ff5f56; }
    .dot-yellow { fill: #ffbd2e; }
    .dot-green { fill: #27c93f; }
    .window-title { font-family: "Fira Code", "Cascadia Code", monospace; font-size: 12px; fill: #8b949e; font-weight: 600; }
    .header-name { font-family: "Fira Code", "Cascadia Code", monospace; font-size: 16px; fill: #58a6ff; font-weight: bold; }
    .header-host { font-family: "Fira Code", "Cascadia Code", monospace; font-size: 16px; fill: #8b949e; }
    .separator { font-family: "Fira Code", "Cascadia Code", monospace; font-size: 13px; fill: #30363d; }
    .label { font-family: "Fira Code", "Cascadia Code", monospace; font-size: 12px; fill: #79c0ff; font-weight: bold; }
    .val { font-family: "Fira Code", "Cascadia Code", monospace; font-size: 12px; fill: #c9d1d9; }
    
    .animate-row {
      opacity: 0;
      animation: fadeInUp 0.5s ease-out forwards;
    }
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
  </style>

  <!-- Background Card -->
  <rect class="bg" width="490" height="360" />

  <!-- Top Title Bar -->
  <path d="M 0,10 A 10,10 0 0,1 10,0 L 480,0 A 10,10 0 0,1 490,10 L 490,36 L 0,36 Z" fill="#161b22" />
  <line x1="0" y1="36" x2="490" y2="36" stroke="#30363d" stroke-width="1" />
  
  <!-- Window Control Buttons -->
  <circle cx="20" cy="18" r="6" class="dot-red" />
  <circle cx="40" cy="18" r="6" class="dot-yellow" />
  <circle cx="60" cy="18" r="6" class="dot-green" />
  
  <!-- Window Title -->
  <text x="245" y="22" text-anchor="middle" class="window-title">bhaikd@github ~ whoami</text>

  <!-- Content Rows -->
  <g transform="translate(22, 65)">
    <!-- Header row -->
    <g class="animate-row" style="animation-delay: 0.1s;">
      <text x="0" y="0">
        <tspan class="header-name">Kishalay Das</tspan><tspan class="header-host"> (bhaikd)</tspan>
      </text>
    </g>

    <!-- Separator -->
    <g class="animate-row" style="animation-delay: 0.2s;">
      <text x="0" y="18" class="separator">------------------------------------------</text>
    </g>

    <!-- Key/Value Rows -->
    <g class="animate-row" style="animation-delay: 0.30s;">
      <text x="0" y="44">
        <tspan class="label">Name       </tspan> <tspan class="val">Kishalay Das</tspan>
      </text>
    </g>
    <g class="animate-row" style="animation-delay: 0.45s;">
      <text x="0" y="76">
        <tspan class="label">Role       </tspan> <tspan class="val">Developer &amp; Open-Source Contributor</tspan>
      </text>
    </g>
    <g class="animate-row" style="animation-delay: 0.60s;">
      <text x="0" y="108">
        <tspan class="label">Focus      </tspan> <tspan class="val">Architecting MVPs &amp; Rapid Execution</tspan>
      </text>
    </g>
    <g class="animate-row" style="animation-delay: 0.75s;">
      <text x="0" y="140">
        <tspan class="label">Languages  </tspan> <tspan class="val">C++, Python, JS/TS, Java, Kotlin, C#</tspan>
      </text>
    </g>
    <g class="animate-row" style="animation-delay: 0.90s;">
      <text x="0" y="172">
        <tspan class="label">Frameworks </tspan> <tspan class="val">React, React Native, Node.js, PyTorch</tspan>
      </text>
    </g>
    <g class="animate-row" style="animation-delay: 1.05s;">
      <text x="0" y="204">
        <tspan class="label">Databases  </tspan> <tspan class="val">MongoDB, Supabase, MySQL</tspan>
      </text>
    </g>
    <g class="animate-row" style="animation-delay: 1.20s;">
      <g transform="translate(0, 241)">
        <rect x="0" y="0" width="22" height="14" fill="#484f58" rx="3" />
        <rect x="28" y="0" width="22" height="14" fill="#ff7b72" rx="3" />
        <rect x="56" y="0" width="22" height="14" fill="#3fb950" rx="3" />
        <rect x="84" y="0" width="22" height="14" fill="#d29922" rx="3" />
        <rect x="112" y="0" width="22" height="14" fill="#58a6ff" rx="3" />
        <rect x="140" y="0" width="22" height="14" fill="#bc8cff" rx="3" />
        <rect x="168" y="0" width="22" height="14" fill="#39c5cf" rx="3" />
        <rect x="196" y="0" width="22" height="14" fill="#b1bac4" rx="3" />
      </g>
    </g>
  </g>
</svg>
